
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LearnOnline - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body { background: #f4f7fb; }
        .navbar { background: #102a43; }
        .hero {
            background: linear-gradient(135deg, #102a43, #247ba0);
            color: white;
            padding: 70px 25px;
            border-radius: 18px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">LearnOnline</a>
        <div>
            <a class="btn btn-outline-light me-2" href="/">Home</a>
            <a class="btn btn-light" href="/course/">Courses</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <section class="hero text-center shadow">
        <h1 class="display-4 fw-bold">Welcome to LearnOnline</h1>
        <p class="lead mt-3">
            Learn programming, explore lessons, and test your knowledge.
        </p>
        <a href="/course/" class="btn btn-warning btn-lg mt-3">
            Explore Course
        </a>
    </section>

    <div class="row g-4 mt-4">
        <div class="col-md-4">
            <div class="card shadow-sm p-4 h-100">
                <h3>Learn</h3>
                <p>Explore lessons and learn at your own pace.</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm p-4 h-100">
                <h3>Practice</h3>
                <p>Test your knowledge with an online exam.</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm p-4 h-100">
                <h3>View Results</h3>
                <p>Check your score after submitting the exam.</p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
